# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: verify tag before releasing
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskq
          POSTGRES_PASSWORD: taskq
          POSTGRES_DB: taskq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskq"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TASKQ_REDIS_ADDR: localhost:6379
      TASKQ_POSTGRES_DSN: postgres://taskq:taskq@localhost:5432/taskq_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - run: go build ./...
      - run: go vet ./...
      - env:
          CGO_ENABLED: 1
        run: go test -race ./...
      - run: go test -run TestConformance -v ./taskqtest/... ./membroker/... ./redisbroker/... ./pgbroker/...

      # Catches "tagged v2.0.0, forgot the /v2 suffix in go.mod" before
      # it's a mess to unwind on the module proxy.
      - name: verify module path matches tag major version
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"
          MODPATH="$(go list -m)"
          if [[ "$MAJOR" =~ ^v[2-9][0-9]*$ ]]; then
            if [[ "$MODPATH" != *"/${MAJOR}" ]]; then
              echo "::error::tag ${TAG} implies module path suffix /${MAJOR}, but go.mod declares ${MODPATH}"
              exit 1
            fi
          fi

  release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}